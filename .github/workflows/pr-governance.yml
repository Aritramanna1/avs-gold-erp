name: PR Governance & Stacked PR Verification

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-governance:
    name: Validate PR & Stacked PR Flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate PR Title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Validating PR Title: $PR_TITLE"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\.\-]+\))?:\s.+$"
          if [[ ! "$PR_TITLE" =~ $REGEX ]] && [[ ! "$PR_TITLE" =~ ^\[Stack\]: ]]; then
            echo "::warning title=PR Title Convention::PR title should follow Conventional Commits format e.g., 'feat(billing): ...', 'fix(ledger): ...', or '[Stack]: ...'"
          else
            echo "PR Title matches convention."
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Validation
        run: npm run typecheck

      - name: Gold & Accounting Invariant Tests
        run: |
          npm run qa:gold
          npm run qa:accounting

      - name: Build Verification
        run: npm run build
