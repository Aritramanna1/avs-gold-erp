name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-template:
    name: Validate PR template
    runs-on: ubuntu-latest
    steps:
      - name: Check required PR sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "## Goal",
              "## Module",
              "## Owner",
              "## Parent PR / Parent Branch",
              "## Depends On",
              "## Stack",
              "## Files Changed",
              "## Business Rules Affected",
              "## Database Impact",
              "## Migration Impact",
              "## RLS / Permission Impact",
              "## Universal Posting Engine Impact",
              "## UI Impact",
              "## Desktop / Tablet / Mobile Impact",
              "## Tests / Checks",
              "## Risks",
              "## Rollback Notes",
              "## Screenshots",
            ];
            const missing = required.filter((section) => !body.includes(section));
            if (missing.length) {
              core.setFailed(`PR description is missing required sections: ${missing.join(", ")}`);
            }

            const placeholders = [
              "#___",
              "<!-- What problem does this PR solve? -->",
              "<!-- Example: Billing, Customer Portal, Reports, Settings, Database, Docs -->",
              "<!-- Agent, developer, or team responsible for this PR/stack slice. -->",
              "<!-- #___ or N/A -->",
              "<!-- develop, feature/..., fix/... -->",
              "<!-- List parent PRs, migrations, feature flags, or external setup. -->",
              "<!-- Slice name -->",
            ];
            const retained = placeholders.filter((placeholder) =>
              body.includes(placeholder),
            );
            if (retained.length) {
              core.setFailed(
                `PR description still contains template placeholders: ${retained.join(", ")}`,
              );
            }

            function section(name) {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = body.match(
                new RegExp(`## ${escaped}\\s*([\\s\\S]*?)(?=\\n## |$)`, "i"),
              );
              return match ? match[1].trim() : "";
            }

            const parent = section("Parent PR / Parent Branch");
            const dependsOn = section("Depends On");
            const stack = section("Stack");
            const owner = section("Owner");
            if (!/(@?[A-Za-z0-9_.-]+|Agent\s+[A-Za-z0-9_.-]+|team\s+[A-Za-z0-9_.-]+)/i.test(owner)) {
              core.setFailed("Owner must identify the agent, developer, or team responsible for this PR.");
            }
            if (!/(Parent PR:\s*(N\/A|#\d+)|Parent branch:\s*`?[^`\n]+`?)/i.test(parent)) {
              core.setFailed(
                "Parent PR / Parent Branch must identify N/A or a concrete parent PR/branch.",
              );
            }
            if (!/(N\/A|None|#\d+|migration|feature flag|external setup|branch)/i.test(dependsOn)) {
              core.setFailed(
                "Depends On must identify N/A/None or concrete parent PRs, migrations, feature flags, branches, or external setup.",
              );
            }
            if (!/(THIS PR|PR #\d+)/i.test(stack)) {
              core.setFailed("Stack must identify THIS PR and/or concrete PR numbers.");
            }

  validate-migration-queue:
    name: Validate migration queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require migration queue updates for migration changes
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          if echo "$changed" | grep -q '^supabase/migrations/'; then
            echo "$changed" | grep -q '^docs/MIGRATION_QUEUE.md$' || {
              echo "Database migrations require a matching docs/MIGRATION_QUEUE.md update."
              exit 1
            }
          fi
      - name: Validate migration queue metadata
        run: npm run validate:migration-queue

  label:
    name: Apply PR labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
