name: "CodeQL Custom Configuration"

queries:
  - uses: security-extended

paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/dist-*/**'
  - '**/production-dist-*/**'
  - '**/playwright-report/**'
  - '**/test-results/**'
  - '**/qa/reports-output/**'
  - '**/*.min.js'
  - '**/*.bundle.js'
  - '**/_reconstruction/**'
  - '**/_quarantine/**'
  - '**/baseline-documentation/**'
  - '**/scratch/**'
