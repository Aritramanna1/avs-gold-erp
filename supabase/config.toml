# Invitation-only: global signup disabled; email provider stays on for login + invites.
[auth]
enabled = true
enable_signup = false
site_url = "https://aurum.arivahly.in"
additional_redirect_urls = [
  "https://maatarajewellers.shop",
  "https://maatarajewellers.shop/**",
  "https://maatarajewellers.shop/auth/callback",
  "https://maatarajewellers.shop/trial/start",
  "https://maatarajewellers.shop/login",
  "https://maatarajewellers.shop/reset-password",
  "https://maatarajewellers.shop/invite/**",
  "http://localhost:3000",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/**",
  "https://localhost",
  "https://localhost/**",
  "https://localhost/auth/callback",
  "https://localhost/trial/start",
  "https://localhost/login",
  "in.arivahly.ornexa://auth/callback",
  "https://aurum.arivahly.in",
  "https://aurum.arivahly.in/**",
  "https://aurum.arivahly.in/auth/callback",
  "https://aurum.arivahly.in/login",
  "https://aurum.arivahly.in/invite/**",
  "https://aurum.erp.arivahly.in/auth/callback",
  "https://aurum.erp.arivahly.in/**",
  "https://erp.aurum.arivahly.in/auth/callback",
  "https://erp.aurum.arivahly.in/**",
  "https://aurumportal.arivahly.in/auth/callback",
  "https://aurumportal.arivahly.in/**",
  "https://aurum-erp.arivahly.in/auth/callback",
  "https://aurum-erp.arivahly.in/**",
]

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Login edge function — public endpoint with own credential verification.
[functions.auth-login]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.tenant-purchase-plan]
verify_jwt = true

[functions.razorpay-create-order]
verify_jwt = true

[functions.platform-payment-api]
verify_jwt = true

[functions.example-api]
verify_jwt = true
